[package]
name = "dsh-jobs-local"
version = "0.1.0-rc.5"
edition = "2024"
license = "MIT"
description = "Process-local provider for the background-job seam (ctx.jobs): in-memory records, fresh snapshots, scope-layered controllers and listeners — Rust port of @deepseek-ai/dsh-jobs-local"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-invariants = { path = "../../util/invariants" }
dsh-jobs = { path = "../jobs" }
dsh-scope = { path = "../../core/scope" }
dsh-timeout = { path = "../../util/timeout" }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
dsh-scope = { path = "../../core/scope" }
dsh-session = { path = "../../core/session" }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
