[package]
name = "dsh-workflow"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Workflow orchestration capability seam and browser-safe lifecycle vocabulary — Rust port of @deepseek-ai/dsh-workflow"

[dependencies]
async-trait = { workspace = true }
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-brand = { path = "../../util/brand" }
dsh-llm = { path = "../../core/llm" }
dsh-session = { path = "../../core/session" }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
