[package]
name = "dsh-tool-computer-use-command"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Native browser and external command adapters for the optional computer_use tool"

[dependencies]
async-trait = { workspace = true }
base64 = "0.22"
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-attachment = { path = "../../attachment/attachment" }
dsh-llm = { path = "../../core/llm" }
dsh-native-command = { path = "../../util/native-command" }
dsh-session = { path = "../../core/session" }
dsh-tools = { path = "../../core/tools" }
futures = { workspace = true }
parking_lot = { workspace = true }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.29"
uuid = { workspace = true }

[dev-dependencies]
dsh-scope = { path = "../../core/scope" }
dsh-system-prompt = { path = "../../core/system-prompt" }
tokio = { workspace = true }
