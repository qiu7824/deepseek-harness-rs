[package]
name = "dsh-uu-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Isolated UU desktop controller process for the Rust Host"

[[bin]]
name = "dsh-uu-controller"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62.2", features = ["Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
