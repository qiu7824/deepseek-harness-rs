[package]
name = "dsh-desktop-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Windows desktop control process for the Rust Host"

[[bin]]
name = "dsh-desktop-controller"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62.2", features = ["Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
