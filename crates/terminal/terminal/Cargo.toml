[package]
name = "dsh-terminal"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Persistent PTY session seam: owner-scoped ids, backend registry, interactive sends, reads, signals, and awaited cleanup — Rust port of @deepseek-ai/dsh-terminal"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-brand = { path = "../../util/brand" }
dsh-invariants = { path = "../../util/invariants" }
dsh-session = { path = "../../core/session" }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
dsh-scope = { path = "../../core/scope" }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
