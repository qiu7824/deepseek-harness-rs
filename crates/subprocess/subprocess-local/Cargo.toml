[package]
name = "dsh-subprocess-local"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "The local implementation of the subprocess capability seam: Rust port of @deepseek-ai/dsh-subprocess-local"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-subprocess = { path = "../subprocess" }
dsh-workspace-resources = { path = "../../workspace/workspace-resources" }
dsh-timeout = { path = "../../util/timeout" }
dsh-invariants = { path = "../../util/invariants" }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
