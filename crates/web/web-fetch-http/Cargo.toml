[package]
name = "dsh-web-fetch-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anonymous public HTTP(S) fetch provider"

[dependencies]
dsh-http-proxy = { path = "../../util/http-proxy" }
async-trait.workspace = true
cordis = { path = "../../vendor/cordis" }
dsh-web = { path = "../web" }
futures.workspace = true
flate2 = "=1.1.9"
brotli = "=8.0.4"
encoding_rs = "=0.8.35"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
url = "2.5"

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["test-util"] }
