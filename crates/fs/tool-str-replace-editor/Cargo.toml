[package]
name = "dsh-tool-str-replace-editor"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Model-facing str_replace_editor over the Harness filesystem seam — Rust port of @deepseek-ai/dsh-tool-str-replace-editor"

[dependencies]
