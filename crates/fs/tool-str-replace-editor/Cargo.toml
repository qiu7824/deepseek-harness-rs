dsh-session = { path = "../../core/session" }
dsh-tools = { path = "../../core/tools" }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
