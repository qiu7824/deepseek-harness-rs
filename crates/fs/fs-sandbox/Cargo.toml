[package]
name = "dsh-fs-sandbox"
version = "0.1.0-rc.5"
edition = "2024"
license = "MIT"
description = "SandboxedFileSystem: the sandbox-enforcing implementation of the dsh-fs Service Definition: Rust port of @deepseek-ai/dsh-fs-sandbox"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-fs = { path = "../fs" }
dsh-fs-local = { path = "../fs-local" }
dsh-sandbox = { path = "../../sandbox/sandbox" }
dsh-sandbox-policy = { path = "../../sandbox/sandbox-policy" }
dsh-invariants = { path = "../../util/invariants" }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
