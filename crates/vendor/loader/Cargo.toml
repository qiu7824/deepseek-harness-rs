[package]
name = "dsh-cordis-loader"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Loader service for cordis: Rust port of @deepseek-ai/cordis-plugin-loader"

[dependencies]
cordis = { path = "../cordis" }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
dsh-session = { path = "../../core/session" }
dsh-token-meter = { path = "../../llm/token-meter" }
dsh-llm = { path = "../../core/llm" }
dsh-commands = { path = "../../interaction/commands" }
dsh-compaction = { path = "../../compaction/compaction" }
dsh-command-compact = { path = "../../compaction/command-compact" }
dsh-compaction-tool-result-pruner = { path = "../../compaction/compaction-tool-result-pruner" }
