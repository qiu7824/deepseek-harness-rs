[package]
name = "dsh-llm-deepseek"
version = "0.1.0-rc.5"
edition = "2024"
license = "MIT"
description = "Production DeepSeek chat-completions adapter for the DeepSeek Harness"

[dependencies]
async-stream = "=0.3.6"
async-trait = { workspace = true }
bytes = "1"
cordis = { path = "../../vendor/cordis" }
dsh-llm = { path = "../../core/llm" }
futures = { workspace = true }
http-body-util = "0.1"
httpdate = "=1.0.3"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }