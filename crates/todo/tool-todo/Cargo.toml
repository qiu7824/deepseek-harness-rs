[package]
name = "dsh-tool-todo"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Model-facing whole-list todo replacement tool — Rust port of @deepseek-ai/dsh-tool-todo"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-invariants = { path = "../../util/invariants" }
dsh-llm = { path = "../../core/llm" }
dsh-session = { path = "../../core/session" }
dsh-session-projection = { path = "../../session/session-projection" }
dsh-tools = { path = "../../core/tools" }
anyhow = { workspace = true }
