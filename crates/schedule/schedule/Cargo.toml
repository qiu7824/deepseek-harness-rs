[package]
name = "dsh-schedule"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Host-wide durable reminders with compatible legacy session history: Rust port of @deepseek-ai/dsh-schedule"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-brand = { path = "../../util/brand" }
dsh-invariants = { path = "../../util/invariants" }
dsh-llm = { path = "../../core/llm" }
dsh-session = { path = "../../core/session" }
dsh-session-projection = { path = "../../session/session-projection" }
dsh-tools = { path = "../../core/tools" }
dsh-scope = { path = "../../core/scope" }
dsh-storage-domain = { path = "../../storage/storage-domain" }
indexmap = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }

[dev-dependencies]
dsh-storage = { path = "../../storage/storage" }
dsh-storage-json = { path = "../../storage/storage-json" }
dsh-system-prompt = { path = "../../core/system-prompt" }
tokio = { workspace = true }
serde_json = { workspace = true }
