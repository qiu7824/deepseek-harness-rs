[package]
name = "dsh-schedule-host"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Host-owned scheduled tasks: durable rules, delivery into their original session, history and management operations"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-atomic-write = { path = "../../util/atomic-write" }
dsh-llm = { path = "../../core/llm" }
dsh-tools = { path = "../../core/tools" }
chrono = { workspace = true }
chrono-tz = "0.10"
futures = { workspace = true }
iana-time-zone = "0.1"
