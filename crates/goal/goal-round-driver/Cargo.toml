[package]
name = "dsh-goal-round-driver"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Race-fenced same-session goal-round driver — Rust port of @deepseek-ai/dsh-goal-round-driver"

[dependencies]
async-trait = { workspace = true }
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-goal = { path = "../goal" }
dsh-invariants = { path = "../../util/invariants" }
