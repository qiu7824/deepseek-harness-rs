[package]
name = "dsh-command-goal"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Human-facing /goal command over persisted same-session goals — Rust port of @deepseek-ai/dsh-command-goal"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-commands = { path = "../../interaction/commands" }
dsh-goal = { path = "../goal" }
dsh-invariants = { path = "../../util/invariants" }
async-trait = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
dsh-agent = { path = "../../core/agent" }
dsh-scope = { path = "../../core/scope" }
dsh-session = { path = "../../core/session" }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
