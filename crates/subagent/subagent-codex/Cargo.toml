[package]
name = "dsh-subagent-codex"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Real out-of-process Codex app-server one-shot subagent provider"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-llm = { path = "../../core/llm" }
dsh-session = { path = "../../core/session" }
dsh-subagent = { path = "../subagent" }
dsh-subprocess = { path = "../../subprocess/subprocess" }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
dsh-agent = { path = "../../core/agent" }
dsh-scope = { path = "../../core/scope" }
dsh-subprocess-local = { path = "../../subprocess/subprocess-local" }
libc = { workspace = true }

[[bin]]
name = "codex-app-server-fixture"
path = "tests/fixtures/codex_app_server_fixture.rs"
test = false
bench = false
