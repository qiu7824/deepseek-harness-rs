[package]
name = "dsh-sandbox-local"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Local platform sandbox runner selection with fail-closed confinement"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-sandbox = { path = "../sandbox" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true }
