[package]
name = "dsh-llm"
version = "0.1.0-rc.5"
edition = "2024"
license = "MIT"
description = "Canonical provider-neutral message and streaming vocabulary plus the adapter runtime: Rust port of @deepseek-ai/dsh-llm"

[dependencies]
dsh-brand = { path = "../../util/brand" }
dsh-timeout = { path = "../../util/timeout" }
dsh-invariants = { path = "../../util/invariants" }
cordis = { path = "../../vendor/cordis" }
async-trait = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
