[package]
name = "dsh-user-approval"
version = "0.1.0-rc.5"
edition = "2024"
license = "MIT"
description = "User-approval seam (ctx.approval): one-shot permission decisions over the approval/request waterfall, fail-closed by default — Rust port of @deepseek-ai/dsh-user-approval"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-brand = { path = "../../util/brand" }
dsh-invariants = { path = "../../util/invariants" }
dsh-llm = { path = "../../core/llm" }
dsh-scope = { path = "../../core/scope" }
dsh-session = { path = "../../core/session" }
dsh-system-prompt = { path = "../../core/system-prompt" }
async-trait = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
