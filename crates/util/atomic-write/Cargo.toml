[package]
name = "dsh-atomic-write"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Atomic file replacement and writer coordination: Rust port of @deepseek-ai/dsh-atomic-write"

[dependencies]
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
