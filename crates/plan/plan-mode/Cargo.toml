[package]
name = "dsh-plan-mode"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Plan mode: logged per-agent collaboration state with the plan:policy guidance section, the /plan command, and the stable exit tool — Rust port of @deepseek-ai/dsh-plan-mode"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-commands = { path = "../../interaction/commands" }
dsh-invariants = { path = "../../util/invariants" }
dsh-llm = { path = "../../core/llm" }
dsh-session = { path = "../../core/session" }
dsh-session-projection = { path = "../../session/session-projection" }
dsh-system-prompt = { path = "../../core/system-prompt" }
dsh-tools = { path = "../../core/tools" }
dsh-user-questions = { path = "../../interaction/user-questions" }
async-trait = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
dsh-scope = { path = "../../core/scope" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
