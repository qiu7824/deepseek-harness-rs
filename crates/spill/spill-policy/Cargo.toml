[package]
name = "dsh-spill-policy"
version = "0.1.0-rc.5"
edition = "2024"
license = "MIT"
description = "The spill-policy plugin: a tools/post-execute transformer that keeps oversized plain-text tool results out of the model's context: Rust port of @deepseek-ai/dsh-spill-policy"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-llm = { path = "../../core/llm" }
dsh-output-retention = { path = "../../util/output-retention" }
dsh-session = { path = "../../core/session" }
dsh-spill = { path = "../spill" }
dsh-tools = { path = "../../core/tools" }
dsh-invariants = { path = "../../util/invariants" }
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
dsh-system-prompt = { path = "../../core/system-prompt" }
dsh-scope = { path = "../../core/scope" }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
