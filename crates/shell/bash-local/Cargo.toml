[package]
name = "dsh-bash-local"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Local bash executor over the subprocess seam: command defaulting, deadlines, cause classification, and model-facing background reads — Rust port of @deepseek-ai/dsh-bash-local"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-invariants = { path = "../../util/invariants" }
dsh-settings = { path = "../../settings/settings" }
dsh-shell = { path = "../shell" }
dsh-subprocess = { path = "../../subprocess/subprocess" }
dsh-timeout = { path = "../../util/timeout" }
dsh-schemastery = { path = "../../vendor/schemastery" }
async-trait = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
dsh-subprocess-local = { path = "../../subprocess/subprocess-local" }
async-trait = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
