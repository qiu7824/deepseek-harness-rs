[package]
name = "dsh-host"
version = "0.1.0-rc.5"
edition = "2024"
license = "MIT"
description = "Runnable DeepSeek Harness Host assembly (M6) — Rust port of the apps/host boot spine"

[[bin]]
name = "dsh-host"
path = "src/main.rs"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent = { path = "../../core/agent" }
dsh-agent-presets = { path = "../../preset/agent-presets" }
dsh-commands = { path = "../../interaction/commands" }
dsh-cordis-loader = { path = "../../vendor/loader" }
dsh-command-goal = { path = "../../goal/command-goal" }
dsh-goal = { path = "../../goal/goal" }
dsh-tool-goal = { path = "../../goal/tool-goal" }
dsh-host-apiproxy = { path = "../apiproxy" }
dsh-host-directory-picker-browse = { path = "../directory-picker-browse" }
dsh-host-frontend-static = { path = "../frontend-static" }
dsh-host-plugin-inventory = { path = "../plugin-inventory" }
dsh-host-webserver = { path = "../webserver" }
dsh-invariants = { path = "../../util/invariants" }
dsh-llm = { path = "../../core/llm" }
dsh-schedule = { path = "../../schedule/schedule" }
dsh-session = { path = "../../core/session" }
dsh-session-persistence = { path = "../../session/session-persistence" }
dsh-session-persistence-jsonl = { path = "../../session/session-persistence-jsonl" }
dsh-session-query = { path = "../../session/session-query" }
dsh-session-query-sqlite = { path = "../../session/session-query-sqlite" }
dsh-system-prompt = { path = "../../core/system-prompt" }
dsh-tools = { path = "../../core/tools" }
dsh-user-approval = { path = "../../interaction/user-approval" }
dsh-user-questions = { path = "../../interaction/user-questions" }
axum = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
http = { workspace = true }

[dev-dependencies]
dsh-agent-presets = { path = "../../preset/agent-presets" }
dsh-scope = { path = "../../core/scope" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
