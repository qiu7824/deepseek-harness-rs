[package]
name = "dsh-skin-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native self-extracting skin installer for DeepSeek Harness-rs"

[[bin]]
name = "dsh-skin-installer"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"
