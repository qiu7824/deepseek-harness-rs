[package]
name = "dsh-host-plugin-inventory"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Read-only projection of the current Cordis Loader plugin entries. Rust port of @deepseek-ai/dsh-host-plugin-inventory"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-agent-presets = { path = "../../preset/agent-presets" }
dsh-brand = { path = "../../util/brand" }
dsh-cordis-loader = { path = "../../vendor/loader" }
dsh-cordis-include = { path = "../../vendor/include" }
dsh-invariants = { path = "../../util/invariants" }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
indexmap = { workspace = true }
tempfile = "3"
