[package]
name = "dsh-host-directory-picker-native"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Native backend of the directory-picker seam: an OS directory chooser on the host display. Rust port of @deepseek-ai/dsh-host-directory-picker-native"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-host-directory-picker = { path = "../directory-picker" }
dsh-host-directory-picker-browse = { path = "../directory-picker-browse" }
dsh-native-command = { path = "../../util/native-command" }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tokio = { workspace = true }
