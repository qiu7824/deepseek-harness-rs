[package]
name = "dsh-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform ZSUI launcher for the DeepSeek Harness Rust web host"

[[bin]]
name = "dsh-launcher"
path = "src/main.rs"

[dependencies]
dsh-home-paths = { path = "../../util/home-paths" }
serde = { workspace = true }
serde_json = { workspace = true }
semver = "1.0"
ureq = { version = "3.1", features = ["json"] }
zsui = { path = "../../vendor/zsui", default-features = false, features = ["window", "button", "icon", "label", "toggle"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
