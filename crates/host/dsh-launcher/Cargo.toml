[package]
name = "dsh-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform ZSUI launcher for the DeepSeek Harness Rust web host"

[[bin]]
name = "dsh-launcher"
path = "src/main.rs"

[dependencies]
zsui = { git = "https://github.com/qiu7824/zsui.git", rev = "7449fe614af769e02b500294ea4a9442498ddf8c", default-features = false, features = ["window", "button", "label"] }

[build-dependencies]
winresource = "0.1"
