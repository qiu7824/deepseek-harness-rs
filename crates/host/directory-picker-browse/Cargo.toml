[package]
name = "dsh-host-directory-picker-browse"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "Browse backend of the directory-picker seam: one-level directory listing and child-directory creation over the host filesystem. Rust port of @deepseek-ai/dsh-host-directory-picker-browse"

[dependencies]
cordis = { path = "../../vendor/cordis" }
dsh-host-directory-picker = { path = "../directory-picker" }
dsh-invariants = { path = "../../util/invariants" }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
