[package]
name = "dsh-host-cli"
version = "0.1.0-rc.8"
edition = "2024"
license = "MIT"
description = "dsh command-line entry: profile boot, plugin forwarding, and config dumps. Rust port of @deepseek-ai/dsh (apps/cli)"

[[bin]]
name = "dsh"
path = "src/main.rs"

[dependencies]
dsh-acp = { path = "../../acp/acp" }
dsh-app-boot = { path = "../../boot/app-boot" }
dsh-agent = { path = "../../core/agent" }
dsh-subagent = { path = "../../subagent/subagent" }
dsh-jsonrpc-runtime = { path = "../../sdk/jsonrpc-runtime" }
dsh-home-paths = { path = "../../util/home-paths" }
dsh-host = { path = "../dsh-host" }
dsh-llm = { path = "../../core/llm" }
dsh-llm-deepseek = { path = "../../llm/llm-deepseek" }
dsh-session = { path = "../../core/session" }
dsh-session-persistence = { path = "../../session/session-persistence" }
dsh-session-persistence-jsonl = { path = "../../session/session-persistence-jsonl" }
dsh-sandbox-local = { path = "../../sandbox/sandbox-local" }
cordis = { path = "../../vendor/cordis" }
indexmap = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1.52", features = ["v2"] }
libmimalloc-sys = { version = "0.1.49", features = ["extended", "v2"] }

[dev-dependencies]

[build-dependencies]
winresource = "0.1"
