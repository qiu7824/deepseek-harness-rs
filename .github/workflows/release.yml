name: 跨平台发布
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    env:
      CARGO_BUILD_JOBS: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
            binary: dsh.exe
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            binary: dsh
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            binary: dsh
          - os: macos-14
            platform: macos
            arch: aarch64
            binary: dsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with: { toolchain: 1.97.1, components: rustfmt }
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-on-failure: true
      - name: Linux 原生图形依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libgdk-pixbuf-2.0-dev libxkbcommon-dev libwayland-dev
      - name: 版本与产品门禁
        shell: bash
        run: |
          VERSION="$(python tools/verify_release_version.py --print-version)"
          python tools/verify_release_version.py --version "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then python tools/verify_release_version.py --version "${GITHUB_REF_NAME#v}"; fi
          python tools/verify_free_model_catalog.py --model ling-3.0-flash-fin-free --report target/free-model-verification.json
          python tools/verify_product_surface.py
          python -m unittest tools.tests.test_history_window_contract tools.tests.test_product_surface_contract tools.tests.test_rust_ui_contract tools.tests.test_rust_runtime_contract tools.tests.test_release_product_contract tools.tests.test_release_integrity tools.tests.test_launcher_release_contract tools.tests.test_client_performance -v
          node tools/tests/connection_controller_harness.js
          node tools/tests/turn_usage_optional_harness.js
          node tools/tests/rust_release_ui_harness.cjs
          node tools/tests/test_history_compaction.mjs
          cargo test --locked -p dsh-launcher -p dsh-schedule -p dsh-host-plugin-inventory -p dsh-host-apiproxy -p dsh-typert-protocol -p dsh-web -p dsh-web-fetch-http -p dsh-web-search-deepseek -p dsh-tool-web -p dsh-workspace -p dsh-tool-fs -p dsh-subprocess-local -p dsh-host -p dsh-storage-domain -p dsh-storage-json -p dsh-session-projection-cache -p dsh-attachment-local -p dsh-llm-deepseek -- --test-threads=1
          for file in release/plugins/*/lib/client.js; do node --check "$file"; done
          for file in web/dist/plugins/*.js; do node --check "$file"; done
          cargo fmt --all -- --check
      - name: 构建正式二进制
        run: cargo build --locked --release -p dsh-host-cli --bin dsh -p dsh-launcher --bin dsh-launcher -p dsh-skin-installer --bin dsh-skin-installer
      - name: 固化正式 Web 产物
        shell: bash
        run: python tools/stage_release_web.py
      - name: 验证免费模型完整运行链路
        shell: bash
        run: python tools/verify_free_model_catalog.py --model ling-3.0-flash-fin-free --binary target/release/${{ matrix.binary }} --report target/free-model-verification.json
      - name: 解析发布产物前缀
        id: release
        shell: bash
        run: |
          VERSION="$(python tools/verify_release_version.py --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prefix=deepseek-harness-rs-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      - name: 生成便携包
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          python tools/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant core --version "$VERSION"
          python tools/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant skin --version "$VERSION"
          python tools/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant free --version "$VERSION"
      - name: 核验便携包内容
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          python tools/verify_release_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant core --version "$VERSION"
          python tools/verify_release_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant skin --version "$VERSION"
          python tools/verify_release_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant free --version "$VERSION"
      - name: 正式包数据与图片回归
        shell: bash
        run: |
          STAGE="dist/${{ steps.release.outputs.prefix }}-core"
          HOST="$STAGE/deepseek-harness-rs"
          [[ "${{ matrix.platform }}" == "windows" ]] && HOST="$HOST.exe"
          python tools/e2e_settings_model_preserves_data.py --binary "$HOST" --repo "$STAGE" --relocate
          python tools/e2e_session_resume.py --binary "$HOST" --repo "$STAGE"
          python tools/e2e_credentials_compat.py --binary "$HOST"
          python tools/e2e_all_interfaces.py --binary "$HOST"
          for capability in explicit unknown text-only; do
            python tools/e2e_image_capability.py --binary "$HOST" --repo "$STAGE" --model-capability "$capability"
          done
          for image in animated-png animated-gif animated-webp; do
            python tools/e2e_image_capability.py --binary "$HOST" --repo "$STAGE" --image-kind "$image"
          done
      - name: Windows 中文安装器
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python tools/verify_release_version.py --print-version
          if ($LASTEXITCODE -ne 0) { throw 'Release version could not be read' }
          choco install innounp --version 0.50 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'innounp installation failed' }
          $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-6.1.2.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_1_2/innosetup-6.1.2.exe' -OutFile $compilerInstaller
          $expected = 'a3ce1c40ef9c71a92691aaff0f413f530c8c9e3c766be481bc63ca7cc74e35e7'
          if ((Get-FileHash -LiteralPath $compilerInstaller -Algorithm SHA256).Hash -ne $expected) { throw 'Inno Setup checksum mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-6.1.2'
          & innounp -x "-d$compilerRoot" $compilerInstaller
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler extraction failed' }
          $compilers = @(Get-ChildItem -LiteralPath $compilerRoot -Recurse -Filter ISCC.exe)
          if ($compilers.Count -ne 1) { throw 'Pinned compiler path is ambiguous' }
          $compiler = $compilers[0].FullName
          $language = "$env:GITHUB_WORKSPACE\packaging\windows\ChineseSimplified.isl"
          foreach ($variant in @('core', 'skin', 'free')) {
            & $compiler "/DMyAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\dist\deepseek-harness-rs-v$version-windows-x86_64-$variant" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" "/DIconFile=$env:GITHUB_WORKSPACE\packaging\windows\deepseek-black.ico" "/DChineseMessages=$language" "/DVariant=$variant" packaging\windows\deepseek-harness-rs.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed: $variant" }
          }
      - name: 核验 Windows 安装器内容
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in core skin free; do
            python tools/verify_installer_package.py --platform windows --arch x86_64 --variant "$variant" --version "$VERSION"
          done
      - name: Linux DEB 安装包
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in core skin free; do
            STAGE="dist/deepseek-harness-rs-v${VERSION}-linux-x86_64-${variant}"
            PKG="dist/deb-${variant}"
            rm -rf "$PKG"
            mkdir -p "$PKG/DEBIAN" "$PKG/opt/deepseek-harness-rs/${variant}" "$PKG/usr/bin"
            cp -R "$STAGE"/. "$PKG/opt/deepseek-harness-rs/${variant}/"
            printf 'Package: deepseek-harness-rs-%s\nVersion: %s\nSection: devel\nPriority: optional\nArchitecture: amd64\nMaintainer: DeepSeek Harness-rs\nDescription: Rust native DeepSeek Harness Web Agent (%s variant)\n' "$variant" "$VERSION" "$variant" > "$PKG/DEBIAN/control"
            ln -s "/opt/deepseek-harness-rs/${variant}/dsh-launcher" "$PKG/usr/bin/deepseek-harness-rs-${variant}"
            dpkg-deb --root-owner-group --build "$PKG" "dist/deepseek-harness-rs-v${VERSION}-linux-x86_64-${variant}.deb"
          done
      - name: 核验 Linux DEB 内容
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in core skin free; do
            python tools/verify_installer_package.py --platform linux --arch x86_64 --variant "$variant" --version "$VERSION"
          done
      - name: macOS PKG 安装包
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in core skin free; do
            STAGE="dist/deepseek-harness-rs-v${VERSION}-macos-${{ matrix.arch }}-${variant}"
            PKGROOT="dist/pkgroot-${variant}"
            rm -rf "$PKGROOT"
            mkdir -p "$PKGROOT/usr/local/lib/deepseek-harness-rs/${variant}" "$PKGROOT/usr/local/bin"
            cp -R "$STAGE"/. "$PKGROOT/usr/local/lib/deepseek-harness-rs/${variant}/"
            ln -s "../lib/deepseek-harness-rs/${variant}/dsh-launcher" "$PKGROOT/usr/local/bin/deepseek-harness-rs-${variant}"
            pkgbuild --root "$PKGROOT" --identifier "io.github.qiu7824.deepseek-harness-rs.${variant}" --version "$VERSION" "dist/deepseek-harness-rs-v${VERSION}-macos-${{ matrix.arch }}-${variant}.pkg"
          done
      - name: 核验 macOS PKG 内容
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in core skin free; do
            python tools/verify_installer_package.py --platform macos --arch ${{ matrix.arch }} --variant "$variant" --version "$VERSION"
          done
      - name: 生成校验和
        shell: bash
        run: |
          cd dist; RELEASE_PREFIX="${{ steps.release.outputs.prefix }}" CHECKSUM_FILE="SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt" python - <<'PY'
          import hashlib,os,pathlib
          prefix=os.environ['RELEASE_PREFIX']
          files=[p for p in pathlib.Path('.').glob(f'{prefix}-*') if p.is_file()]
          platform='${{ matrix.platform }}'
          portable_ext='zip' if platform == 'windows' else 'tar.gz'
          install_ext={'windows': 'setup.exe', 'linux': 'deb', 'macos': 'pkg'}[platform]
          variants=('core', 'skin', 'free')
          expected={f'{prefix}-{variant}-portable.{portable_ext}' for variant in variants}
          expected.update(
              f'{prefix}-{variant}-{install_ext}' if platform == 'windows'
              else f'{prefix}-{variant}.{install_ext}'
              for variant in variants
          )
          actual={p.name for p in files}
          if actual != expected:
              raise SystemExit(f'unexpected release artifact set: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}')
          pathlib.Path(os.environ['CHECKSUM_FILE']).write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(files)))
          PY
      - name: 上传当前平台产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-harness-rs-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/${{ steps.release.outputs.prefix }}-*-portable.*
            dist/${{ steps.release.outputs.prefix }}-*.exe
            dist/${{ steps.release.outputs.prefix }}-*.deb
            dist/${{ steps.release.outputs.prefix }}-*.pkg
            dist/SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: dist, merge-multiple: true }
      - name: 合并发布校验和
        shell: bash
        run: |
          cd dist
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
      - uses: softprops/action-gh-release@e5ee6bc58a36b838b92fc1217f2e4b414b5abcc8
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release/notes/${{ github.ref_name }}.md
          generate_release_notes: false
          files: dist/*
