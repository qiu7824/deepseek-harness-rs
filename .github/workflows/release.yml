name: 跨平台发布
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
            binary: dsh.exe
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            binary: dsh
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            binary: dsh
          - os: macos-14
            platform: macos
            arch: aarch64
            binary: dsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with: { toolchain: 1.97.1, components: rustfmt }
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-on-failure: true
      - name: Linux 原生图形依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libgdk-pixbuf-2.0-dev libxkbcommon-dev libwayland-dev
          python -B tools/verify_linux_sandbox.py --workdir "$RUNNER_TEMP/dsh-sandbox-preflight" --prepare-ci-profile
      - name: macOS 搜索运行依赖
        if: matrix.platform == 'macos'
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Windows 搜索运行依赖
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'ripgrep installation failed' }
          }
      - name: 搜索运行依赖预检
        shell: bash
        run: rg --no-config --version
      - name: 版本与产品门禁
        timeout-minutes: 10
        shell: bash
        run: |
          VERSION="$(python tools/verify_release_version.py --print-version)"
          python tools/verify_release_version.py --version "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then python tools/verify_release_version.py --version "$VERSION" --tag "$GITHUB_REF_NAME"; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then python tools/promote_release.py notes --tag "$GITHUB_REF_NAME"; fi
          python tools/verify_product_surface.py
          python -B -m unittest tools.tests.test_release_build_identity -v
          python -B -m unittest tools.tests.test_release_promotion -v
          python -B -m unittest tools.tests.test_e2e_http -v
          python -m unittest tools.tests.test_history_window_contract tools.tests.test_product_surface_contract tools.tests.test_rust_ui_contract tools.tests.test_rust_runtime_contract tools.tests.test_release_product_contract tools.tests.test_release_integrity tools.tests.test_launcher_release_contract tools.tests.test_client_performance tools.tests.test_free_model_evidence tools.tests.test_release_variants tools.tests.test_settings_migration_contract tools.tests.test_installer_compile_gate -v
      - name: Web 交互与滚动回归
        timeout-minutes: 15
        shell: bash
        run: |
          node tools/tests/connection_controller_harness.js
          node tools/tests/turn_usage_optional_harness.js
          node tools/tests/rust_release_ui_harness.cjs
          node tools/tests/test_history_compaction.mjs
          node tools/tests/history_retention_harness.cjs
          node tools/tests/history_transactions_harness.cjs
          npm install --prefix "$RUNNER_TEMP/dsh-dom-tests" --ignore-scripts --no-audit --no-fund react@19.2.8 react-dom@19.2.8 react-test-renderer@19.2.8 jsdom@26.1.0
          node tools/tests/model_management_harness.cjs
          node tools/tests/model_management_react_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/task_models_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/productivity_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/generated_images_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/account_browser_login_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/directory_picker_flow_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/learning_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/agent_preset_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/file_actions_graph_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/mobile_layout_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/better_sidebar_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/sidebar_suite_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/artifacts_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/conversation_interactions_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/chat_scroll_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/context_rail_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/ptc_tool_cards_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/response_rendering_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/reply_hint_display_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/question_wait_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/hosted_search_settings_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/workspace_browser_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/workspace_sources_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/feedback_submission_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/session_feedback_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/message_feedback_confirmation_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/file_upload_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/agent_team_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/composer_empty_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/produced_files_presentation_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/turn_tail_location_harness.cjs
          node tools/tests/session_reference_input_harness.cjs
          node tools/tests/session_queue_harness.cjs
          node tools/tests/assistant_steps_harness.cjs
          node tools/tests/assistant_stream_cost_harness.cjs
          node tools/tests/plugin_lifecycle_contract.cjs
          node tools/tests/git_terminal_contract.cjs
          node tools/tests/git_terminal_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          node tools/tests/xterm_asset_contract.cjs
          node tools/tests/runtime_environment_harness.cjs
          node tools/tests/settings_controls_dom_harness.cjs "$RUNNER_TEMP/dsh-dom-tests/node_modules"
      - name: Agent 与预设生命周期回归
        timeout-minutes: 35
        shell: bash
        run: |
          cargo test --locked -p dsh-agent --test creator_context
          cargo test --locked -p dsh-agent-loop --test lifecycle_failures steering
          cargo test --locked -p dsh-agent --test model_switch_notice
          cargo test --locked -p dsh-agent-loop --test lifecycle_failures model_switch
          cargo test --locked -p dsh-agent-loop --test lifecycle_failures compaction_recovery
          cargo test --locked -p dsh-agent-loop --test lifecycle_failures system_prefix
          cargo test --locked -p cordis --test plugin_setup
          cargo test --locked -p dsh-cordis-loader --test group_ownership
          cargo test --locked -p dsh-agent-presets standing_tests --lib
      - name: 会话存储与原生执行回归
        timeout-minutes: 30
        shell: bash
        run: |
          cargo test --locked -p dsh-host-cli --lib headless_selection_tests
          cargo test --locked -p dsh-host-cli --lib history_import
          cargo test --locked -p dsh-host-cli --test history_import_cli
          cargo test --locked -p dsh-session-persistence-jsonl --test history_allocations
          cargo test --locked -p dsh-agent-team -p dsh-http-proxy --lib
          cargo check --locked -p dsh-subprocess-e2b
          cargo test --locked -p dsh-llm-retry -p dsh-system-prompt -p dsh-session-reference -p dsh-spill-local -p dsh-subagent-codex -p dsh-message-feedback -- --test-threads=1
          cargo test --locked -p dsh-workspace-resources -p dsh-subagent -p dsh-pwsh-local -p dsh-tool-pwsh -p dsh-sandbox-local -- --test-threads=1
      - name: Host 与启动器回归
        timeout-minutes: 30
        shell: bash
        run: |
          cargo test --locked -p dsh-settings -p dsh-code-graph -p dsh-app-boot -p dsh-code-runtime-node -p dsh-tools -p dsh-tool-memory-local -p dsh-message-feedback -p dsh-tool-skill -p dsh-skill-filesystem --lib
          cargo test --locked -p dsh-launcher -p dsh-schedule -p dsh-host-plugin-inventory -p dsh-host-apiproxy -p dsh-typert-protocol -p dsh-web -p dsh-web-fetch-http -p dsh-web-search-deepseek -p dsh-tool-web -p dsh-workspace -p dsh-tool-fs -p dsh-native-command -p dsh-subprocess-local -p dsh-terminal -p dsh-terminal-bash -p dsh-jobs-local -p dsh-tool-computer-use-command -p dsh-host -p dsh-storage-domain -p dsh-storage-json -p dsh-session-projection-cache -p dsh-attachment-local -p dsh-llm-deepseek -- --test-threads=1
      - name: 产物脚本与源码格式检查
        timeout-minutes: 5
        shell: bash
        run: |
          for file in release/plugins/*/lib/client.js; do node --check "$file"; done
          for file in web/dist/plugins/*.js; do node --check "$file"; done
          cargo fmt --all -- --check
      - name: Windows 控制器输入协议门禁
        if: matrix.platform == 'windows'
        run: cargo test --locked -p dsh-desktop-controller -p dsh-uu-controller input::tests -- --test-threads=1
      - name: 构建正式二进制
        timeout-minutes: 45
        run: cargo build --locked --release --timings -p dsh-host-cli --bin dsh -p dsh-launcher --bin dsh-launcher -p dsh-skin-installer --bin dsh-skin-installer
      - name: Build Windows desktop controller
        if: matrix.platform == 'windows'
        run: |
          cargo build --locked --release -p dsh-desktop-controller -p dsh-uu-controller
          if ($LASTEXITCODE -ne 0) { throw 'Controller build failed' }
          cargo test --locked -p dsh-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          cargo build --locked --profile desktop -p dsh-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Windows 原生阅读客户端验收
        if: matrix.platform == 'windows'
        run: python tools/verify_desktop_reader.py --binary target/desktop/dsh-desktop.exe --workdir "$env:RUNNER_TEMP/dsh-desktop-reader"
      - name: 固化正式 Web 产物
        shell: bash
        run: python tools/stage_release_web.py
      - name: Host 启动预检
        id: startup_preflight
        timeout-minutes: 2
        shell: bash
        run: python tools/verify_host_startup.py --binary target/release/${{ matrix.binary }} --workdir "$RUNNER_TEMP/dsh-startup-preflight"
      - name: Host 启动失败跟踪
        if: failure() && steps.startup_preflight.outcome == 'failure'
        timeout-minutes: 2
        shell: bash
        run: python tools/verify_host_startup.py --binary target/release/${{ matrix.binary }} --workdir "$RUNNER_TEMP/dsh-startup-trace" --trace-startup
      - name: 验证免费模型完整运行链路
        id: free_probe
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        run: python tools/verify_free_model_catalog.py --all --prefer ling-3.0-flash-fin-free --timeout 160 --binary target/release/${{ matrix.binary }} --report target/free-model-verification.json 2>&1 | tee target/free-model-verification.log
      - name: 选择已验收的发布版本
        id: variants
        shell: bash
        run: python tools/release_variants.py select --report target/free-model-verification.json --binary target/release/${{ matrix.binary }} --probe-outcome '${{ steps.free_probe.outcome }}' --selection-report target/release-variants.json --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: 解析发布产物前缀
        id: release
        shell: bash
        run: |
          VERSION="$(python tools/verify_release_version.py --print-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prefix=deepseek-harness-rs-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      - name: 生成便携包
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          python tools/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant core --version "$VERSION"
          python tools/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant skin --version "$VERSION"
          if [[ " ${{ steps.variants.outputs.variants }} " == *" free "* ]]; then
            python tools/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant free --version "$VERSION"
          fi
      - name: 核验便携包内容
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          python tools/verify_release_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant core --version "$VERSION"
          python tools/verify_release_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant skin --version "$VERSION"
          if [[ " ${{ steps.variants.outputs.variants }} " == *" free "* ]]; then
            python tools/verify_release_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant free --version "$VERSION"
          fi
      - name: 正式包数据与图片回归
        timeout-minutes: 40
        shell: bash
        run: |
          STAGE="dist/${{ steps.release.outputs.prefix }}-core"
          HOST="$STAGE/deepseek-harness-rs"
          [[ "${{ matrix.platform }}" == "windows" ]] && HOST="$HOST.exe"
          python tools/e2e_settings_model_preserves_data.py --binary "$HOST" --repo "$STAGE" --relocate --migrate-home
          python tools/e2e_model_management.py --binary "$HOST" --repo . --node-modules "$RUNNER_TEMP/dsh-dom-tests/node_modules" --workdir "$RUNNER_TEMP/dsh-model-management"
          python tools/e2e_queue_references.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-queue-references"
          python tools/e2e_headless_tools.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-headless-tools"
          python tools/e2e_devin.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-devin-native"
          python tools/e2e_image_generation.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-image-generation"
          python tools/e2e_productivity.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-productivity" --check-auto
          for assignment in none provider model; do
            python tools/e2e_image_generation.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-image-$assignment" --assignment "$assignment"
          done
          python tools/e2e_learning_loop.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-learning-loop"
          python tools/e2e_approval_interactions.py --binary "$HOST" --repo . --node-modules "$RUNNER_TEMP/dsh-dom-tests/node_modules" --workdir "$RUNNER_TEMP/dsh-approval-interactions"
          python tools/e2e_skill_injection.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-skill-injection"
          python tools/e2e_subagent_progress.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-subagent-progress" --node-modules "$RUNNER_TEMP/dsh-dom-tests/node_modules"
          python tools/e2e_file_upload.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-file-upload"
          python tools/e2e_agent_team.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-agent-team"
          python tools/e2e_workspace_insights.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-workspace-insights"
          python tools/e2e_workspace_insights.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-workspace-insights-no-node" --without-node
          python tools/e2e_sidebar_git_terminal.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-sidebar-git-terminal" --without-node
          python tools/e2e_workspace_resources.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-workspace-resources"
          python tools/e2e_workspace_device_settings.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-workspace-device-settings"
          python tools/e2e_workspace_sources.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-workspace-sources"
          python -m pip install --target "$RUNNER_TEMP/dsh-ssh-deps" paramiko==4.0.0
          PYTHONPATH="$RUNNER_TEMP/dsh-ssh-deps" python tools/e2e_workspace_ssh.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-workspace-ssh"
          python tools/e2e_package_variant.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-package-variant" --variant core
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            python tools/e2e_computer_use.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-computer-use"
            python tools/e2e_scratch_context.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-scratch-context"
          fi
          python tools/e2e_session_resume.py --binary "$HOST" --repo "$STAGE"
          python tools/e2e_session_workspace_resume.py --binary "$HOST" --workdir "$RUNNER_TEMP/dsh-session-workspace-resume"
          python tools/e2e_credentials_compat.py --binary "$HOST"
          python tools/e2e_all_interfaces.py --binary "$HOST"
          for capability in explicit unknown text-only; do
            python tools/e2e_image_capability.py --binary "$HOST" --repo "$STAGE" --model-capability "$capability"
          done
          for image in animated-png animated-gif animated-webp; do
            python tools/e2e_image_capability.py --binary "$HOST" --repo "$STAGE" --image-kind "$image"
          done
      - name: Windows 中文安装器
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python tools/verify_release_version.py --print-version
          if ($LASTEXITCODE -ne 0) { throw 'Release version could not be read' }
          choco install innounp --version 0.50 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'innounp installation failed' }
          $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-6.1.2.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_1_2/innosetup-6.1.2.exe' -OutFile $compilerInstaller
          $expected = 'a3ce1c40ef9c71a92691aaff0f413f530c8c9e3c766be481bc63ca7cc74e35e7'
          if ((Get-FileHash -LiteralPath $compilerInstaller -Algorithm SHA256).Hash -ne $expected) { throw 'Inno Setup checksum mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-6.1.2'
          & innounp -x "-d$compilerRoot" $compilerInstaller
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler extraction failed' }
          $compilers = @(Get-ChildItem -LiteralPath $compilerRoot -Recurse -Filter ISCC.exe)
          if ($compilers.Count -ne 1) { throw 'Pinned compiler path is ambiguous' }
          $compiler = $compilers[0].FullName
          $language = "$env:GITHUB_WORKSPACE\packaging\windows\ChineseSimplified.isl"
          $variants = '${{ steps.variants.outputs.variants_json }}' | ConvertFrom-Json
          foreach ($variant in $variants) {
            $compileLog = Join-Path $env:RUNNER_TEMP "dsh-inno-$variant.log"
            & $compiler "/DMyAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\dist\deepseek-harness-rs-v$version-windows-x86_64-$variant" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" "/DIconFile=$env:GITHUB_WORKSPACE\packaging\windows\deepseek-black.ico" "/DChineseMessages=$language" "/DVariant=$variant" packaging\windows\deepseek-harness-rs.iss 2>&1 | Tee-Object -FilePath $compileLog
            if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed: $variant" }
            if (Select-String -LiteralPath $compileLog -Pattern '^\s*Warning:' -Quiet) { throw "Installer compiler warnings: $variant; see $compileLog" }
            python tools/verify_windows_installer_behavior.py --compiler "$compiler" --stage "$env:GITHUB_WORKSPACE\dist\deepseek-harness-rs-v$version-windows-x86_64-$variant" --scratch "$env:RUNNER_TEMP\dsh-installer-behavior-$variant"
            if ($LASTEXITCODE -ne 0) { throw "Isolated installer verification failed: $variant" }
          }
      - name: 核验 Windows 安装器内容
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in ${{ steps.variants.outputs.variants }}; do
            python tools/verify_installer_package.py --platform windows --arch x86_64 --variant "$variant" --version "$VERSION"
          done
      - name: Linux DEB 安装包
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in ${{ steps.variants.outputs.variants }}; do
            STAGE="dist/deepseek-harness-rs-v${VERSION}-linux-x86_64-${variant}"
            PKG="dist/deb-${variant}"
            rm -rf "$PKG"
            mkdir -p "$PKG/DEBIAN" "$PKG/opt/deepseek-harness-rs/${variant}" "$PKG/usr/bin"
            cp -R "$STAGE"/. "$PKG/opt/deepseek-harness-rs/${variant}/"
            printf 'Package: deepseek-harness-rs-%s\nVersion: %s\nSection: devel\nPriority: optional\nArchitecture: amd64\nDepends: bubblewrap, ripgrep\nMaintainer: DeepSeek Harness-rs\nDescription: Rust native DeepSeek Harness Web Agent (%s variant)\n' "$variant" "$VERSION" "$variant" > "$PKG/DEBIAN/control"
            ln -s "/opt/deepseek-harness-rs/${variant}/dsh-launcher" "$PKG/usr/bin/deepseek-harness-rs-${variant}"
            dpkg-deb --root-owner-group --build "$PKG" "dist/deepseek-harness-rs-v${VERSION}-linux-x86_64-${variant}.deb"
          done
      - name: 核验 Linux DEB 内容
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in ${{ steps.variants.outputs.variants }}; do
            python tools/verify_installer_package.py --platform linux --arch x86_64 --variant "$variant" --version "$VERSION"
          done
      - name: macOS PKG 安装包
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in ${{ steps.variants.outputs.variants }}; do
            STAGE="dist/deepseek-harness-rs-v${VERSION}-macos-${{ matrix.arch }}-${variant}"
            PKGROOT="dist/pkgroot-${variant}"
            rm -rf "$PKGROOT"
            mkdir -p "$PKGROOT/usr/local/lib/deepseek-harness-rs/${variant}" "$PKGROOT/usr/local/bin"
            cp -R "$STAGE"/. "$PKGROOT/usr/local/lib/deepseek-harness-rs/${variant}/"
            ln -s "../lib/deepseek-harness-rs/${variant}/dsh-launcher" "$PKGROOT/usr/local/bin/deepseek-harness-rs-${variant}"
            pkgbuild --root "$PKGROOT" --identifier "io.github.qiu7824.deepseek-harness-rs.${variant}" --version "$VERSION" "dist/deepseek-harness-rs-v${VERSION}-macos-${{ matrix.arch }}-${variant}.pkg"
          done
      - name: 核验 macOS PKG 内容
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for variant in ${{ steps.variants.outputs.variants }}; do
            python tools/verify_installer_package.py --platform macos --arch ${{ matrix.arch }} --variant "$variant" --version "$VERSION"
          done
      - name: 生成校验和
        shell: bash
        run: |
          python tools/release_variants.py checksums --directory dist --prefix "${{ steps.release.outputs.prefix }}" --platform ${{ matrix.platform }} --variants-json '${{ steps.variants.outputs.variants_json }}' --output dist/SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
      - name: 保留免费模型验收证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: free-model-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/free-model-verification.json
            target/free-model-verification.log
            target/release-variants.json
          if-no-files-found: warn
      - name: 保留 Host 启动诊断
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-startup-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/dsh-startup-preflight/stdout.log
            ${{ runner.temp }}/dsh-startup-preflight/startup.log
            ${{ runner.temp }}/dsh-startup-preflight/result.json
            ${{ runner.temp }}/dsh-startup-trace/stdout.log
            ${{ runner.temp }}/dsh-startup-trace/startup.log
            ${{ runner.temp }}/dsh-startup-trace/result.json
          if-no-files-found: ignore
      - name: 保留编译耗时报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-timings-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
      - name: 保留会话恢复失败证据
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-restore-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/dsh-session-workspace-resume/history-*.json
            ${{ runner.temp }}/dsh-session-workspace-resume/authority-*.json
            ${{ runner.temp }}/dsh-session-workspace-resume/evidence.json
          if-no-files-found: ignore
      - name: 上传当前平台产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-harness-rs-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/${{ steps.release.outputs.prefix }}-*-portable.*
            dist/${{ steps.release.outputs.prefix }}-*.exe
            dist/${{ steps.release.outputs.prefix }}-*.deb
            dist/${{ steps.release.outputs.prefix }}-*.pkg
            dist/SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 核对发布标签仍对应当前源码
        shell: bash
        run: |
          REMOTE="$(git ls-remote origin "$GITHUB_REF" "${GITHUB_REF}^{}")"
          ACTUAL="$(printf '%s\n' "$REMOTE" | awk '/\^\{\}$/ {print $1; found=1; exit} END {if (!found) exit 1}')" || ACTUAL="$(printf '%s\n' "$REMOTE" | awk 'NR==1 {print $1}')"
          test "$ACTUAL" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: dist, pattern: "deepseek-harness-rs-*", merge-multiple: true }
      - name: 核验四个平台的包集合与校验和
        shell: bash
        run: |
          python tools/promote_release.py payload --tag "$RELEASE_TAG"
          python tools/promote_release.py notes --tag "$RELEASE_TAG"
      - name: 创建或更新发布草稿
        shell: bash
        run: |
          NOTES="$(python tools/promote_release.py notes --tag "$RELEASE_TAG")"
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            FLAGS=()
            if [[ "$RELEASE_PRERELEASE" == true ]]; then FLAGS+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$NOTES" "${FLAGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/deepseek-harness-rs-* dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
      - name: 完整核验后公开并回读发布页
        shell: bash
        run: |
          python tools/promote_release.py staged --tag "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
          python tools/promote_release.py verify --tag "$RELEASE_TAG"
