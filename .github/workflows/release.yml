name: 跨平台发布
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
            binary: dsh.exe
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            binary: dsh
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            binary: dsh
          - os: macos-14
            platform: macos
            arch: aarch64
            binary: dsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with: { toolchain: 1.97.1, components: rustfmt }
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - name: 版本与产品门禁
        shell: bash
        run: |
          python tools/verify_product_surface.py
          python -m unittest tools.tests.test_history_window_contract tools.tests.test_product_surface_contract tools.tests.test_v012_surface_contract -v
          for file in release/plugins/*/lib/client.js; do node --check "$file"; done
          for file in web/dist/plugins/*.js; do node --check "$file"; done
          cargo fmt --all -- --check
      - name: 构建正式二进制
        run: cargo build --locked --release -p dsh-host-cli --bin dsh -p dsh-launcher --bin dsh-launcher -p dsh-skin-installer --bin dsh-skin-installer
      - name: 生成便携包
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.1.0-rc.8"
          python tools/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant core --version "$VERSION"
          python tools/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant skin --version "$VERSION"
      - name: 核验便携包内容
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.1.0-rc.8"
          python tools/verify_release_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant core --version "$VERSION"
          python tools/verify_release_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant skin --version "$VERSION"
      - name: Windows 中文安装器
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $refName = "${env:GITHUB_REF_NAME}"
          $version = if ($refName.StartsWith('v')) { $refName.Substring(1) } else { '0.1.0-rc.8' }
          choco install innosetup -y --no-progress
          $language = "$env:GITHUB_WORKSPACE\packaging\windows\ChineseSimplified.isl"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\dist\deepseek-harness-rs-v$version-windows-x86_64-core" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" "/DIconFile=$env:GITHUB_WORKSPACE\packaging\windows\deepseek-black.ico" "/DChineseMessages=$language" "/DVariant=core" packaging\windows\deepseek-harness-rs.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\dist\deepseek-harness-rs-v$version-windows-x86_64-skin" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" "/DIconFile=$env:GITHUB_WORKSPACE\packaging\windows\deepseek-black.ico" "/DChineseMessages=$language" "/DVariant=skin" packaging\windows\deepseek-harness-rs.iss
      - name: Linux DEB 安装包
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.1.0-rc.8"
          STAGE="dist/deepseek-harness-rs-v${VERSION}-linux-x86_64-core"; PKG="dist/deb"; mkdir -p "$PKG/DEBIAN" "$PKG/opt/deepseek-harness-rs" "$PKG/usr/bin"
          cp -R "$STAGE"/. "$PKG/opt/deepseek-harness-rs/"
          printf 'Package: deepseek-harness-rs\nVersion: %s\nSection: devel\nPriority: optional\nArchitecture: amd64\nMaintainer: DeepSeek Harness-rs\nDescription: Rust native DeepSeek Harness Web Agent\n' "$VERSION" > "$PKG/DEBIAN/control"
          ln -s /opt/deepseek-harness-rs/deepseek-harness-rs "$PKG/usr/bin/deepseek-harness-rs"
          dpkg-deb --build "$PKG" "dist/deepseek-harness-rs-v${VERSION}-linux-x86_64.deb"
      - name: macOS PKG 安装包
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.1.0-rc.8"
          STAGE="dist/deepseek-harness-rs-v${VERSION}-macos-${{ matrix.arch }}-core"; ROOT="dist/pkgroot"; mkdir -p "$ROOT/usr/local/lib/deepseek-harness-rs" "$ROOT/usr/local/bin"; cp -R "$STAGE"/. "$ROOT/usr/local/lib/deepseek-harness-rs/"; ln -s ../lib/deepseek-harness-rs/deepseek-harness-rs "$ROOT/usr/local/bin/deepseek-harness-rs"
          pkgbuild --root "$ROOT" --identifier io.github.qiu7824.deepseek-harness-rs --version "$VERSION" "dist/deepseek-harness-rs-v${VERSION}-macos-${{ matrix.arch }}.pkg"
      - name: 生成校验和
        shell: bash
        run: |
          cd dist; python - <<'PY'
          import hashlib,pathlib
          files=[p for p in pathlib.Path('.').glob('*') if p.is_file()]
          pathlib.Path('SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(files)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-harness-rs-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*-portable.*
            dist/*.exe
            dist/*.deb
            dist/*.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@e5ee6bc58a36b838b92fc1217f2e4b414b5abcc8
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: dist/*
