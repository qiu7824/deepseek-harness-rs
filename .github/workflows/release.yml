name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dsh-windows-x86_64
            binary: target/release/dsh.exe
          - os: ubuntu-latest
            asset: dsh-linux-x86_64
            binary: target/release/dsh
          - os: macos-14
            asset: dsh-macos-aarch64
            binary: target/release/dsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Build release binary
        run: cargo build --release -p dsh-host-cli --bin dsh
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.binary }}' -DestinationPath '${{ matrix.asset }}.zip'
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf '${{ matrix.asset }}.tar.gz' -C target/release dsh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
