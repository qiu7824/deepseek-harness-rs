name: Host 回归诊断

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/host-regressions.yml
      - tools/run_release_regression.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with: { toolchain: 1.97.1, components: rustfmt }
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-on-failure: true
      - name: 隔离并规范测试临时目录
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'dsh-tests'
          root.mkdir(parents=True, exist_ok=True)
          root = root.resolve(strict=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              for key in ('TEMP', 'TMP', 'TMPDIR', 'DSH_TEST_TEMP_DIR'):
                  stream.write(f'{key}={root}\n')
          PY
      - name: 搜索运行依赖
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'ripgrep installation failed' }
          }
      - name: macOS 搜索运行依赖
        if: matrix.platform == 'macos'
        shell: bash
        run: command -v rg >/dev/null || brew install ripgrep
      - name: 固定测试 Node 运行时
        shell: bash
        run: |
          python tools/stage_node_runtime.py --stage "$RUNNER_TEMP/dsh-test-runtime" --platform '${{ matrix.platform }}' --arch x86_64 --cache "$RUNNER_TEMP/dsh-node-cache"
          echo "$RUNNER_TEMP/dsh-test-runtime/runtime/node" >> "$GITHUB_PATH"
      - name: Host 库回归与公开失败摘要
        shell: bash
        run: python tools/run_release_regression.py --log "$RUNNER_TEMP/host-library.log" -- cargo test --locked -p dsh-settings -p dsh-code-graph -p dsh-app-boot -p dsh-code-runtime-node -p dsh-tools -p dsh-tool-memory-local -p dsh-message-feedback -p dsh-tool-skill -p dsh-skill-filesystem -p dsh-schedule-host -p dsh-knowledge-base -p dsh-atomic-write --lib
      - name: Host 与启动器回归及公开失败摘要
        shell: bash
        run: python tools/run_release_regression.py --log "$RUNNER_TEMP/host-launcher.log" -- cargo test --locked -p dsh-launcher -p dsh-schedule -p dsh-host-plugin-inventory -p dsh-host-apiproxy -p dsh-typert-protocol -p dsh-web -p dsh-web-fetch-http -p dsh-web-search-deepseek -p dsh-tool-web -p dsh-workspace -p dsh-tool-fs -p dsh-native-command -p dsh-subprocess-local -p dsh-terminal -p dsh-terminal-bash -p dsh-jobs-local -p dsh-tool-computer-use-command -p dsh-host -p dsh-storage-domain -p dsh-storage-json -p dsh-session-projection-cache -p dsh-attachment-local -p dsh-llm-deepseek -- --test-threads=1
      - name: 保存回归日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-regression-logs-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/host-library.log
            ${{ runner.temp }}/host-launcher.log
          if-no-files-found: ignore
