name: 发布已验收的跨平台产物
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 成功的跨平台发布构建运行 ID
        required: true
        type: string
      tag:
        description: 与构建提交一致的现有发布标签
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERIFIED_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 发布完整性回归
        run: python -B -m unittest tools.tests.test_release_promotion -v
      - name: 核对验收结果、提交和全部平台产物
        run: python tools/promote_release.py identity --run-id "$VERIFIED_RUN" --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: dist
          pattern: deepseek-harness-rs-*
          merge-multiple: true
      - name: 校验完整包与合并校验和
        run: python tools/promote_release.py payload --tag "$RELEASE_TAG"
      - name: 发布全部平台附件与完整更新说明
        run: |
          gh release upload "$RELEASE_TAG" dist/deepseek-harness-rs-* dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --notes-file "release/notes/$RELEASE_TAG.md"
      - name: 回读发布页并核对每个附件
        run: python tools/promote_release.py verify --tag "$RELEASE_TAG"
