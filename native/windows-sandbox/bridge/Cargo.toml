[package]
name="dsh-windows-native"
version="0.1.0"
edition="2024"
license="MIT"
[dependencies]
anyhow="1"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
toml="0.9"
fs2="0.4"
codex-utils-pty={git="https://github.com/openai/codex",rev="bb5054fe47abe73ecbbd454751066a28c89f4bb9"}
tokio={version="1",features=["rt-multi-thread","macros","signal","time","sync"]}
codex-windows-sandbox={path="../engine"}
codex-protocol={git="https://github.com/openai/codex",rev="bb5054fe47abe73ecbbd454751066a28c89f4bb9"}
codex-utils-absolute-path={git="https://github.com/openai/codex",rev="bb5054fe47abe73ecbbd454751066a28c89f4bb9"}
windows-sys={version="0.52",features=["Win32_Foundation","Win32_System_Console","Win32_System_Threading","Win32_Security","Win32_Security_Authorization","Win32_UI_Shell","Win32_System_Com"]}
