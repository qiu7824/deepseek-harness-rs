bin = [
    { name = "dsh-windows-sandbox-setup", path = "src/bin/setup_main/main.rs" },
    { name = "dsh-command-runner", path = "src/bin/command_runner/main.rs" },
]

[package]
build = "build.rs"
edition = "2024"
license = "Apache-2.0"
name = "codex-windows-sandbox"
version = "0.0.0"

[lib]
name = "codex_windows_sandbox"
path = "src/lib.rs"
doctest = false

[dependencies]
sha2 = "0.10"
anyhow = "1.0"
dunce = "1.0"
serde_json = "1.0"
tempfile = "3"

[dependencies.base64]
version = "0.22.1"

[dependencies.chrono]
version = "0.4.42"
default-features = false
features = [
    "clock",
    "std",
]

[dependencies.codex-utils-pty]
git = "https://github.com/openai/codex"
rev = "bb5054fe47abe73ecbbd454751066a28c89f4bb9"

[dependencies.codex-utils-absolute-path]
git = "https://github.com/openai/codex"
rev = "bb5054fe47abe73ecbbd454751066a28c89f4bb9"

[dependencies.codex-utils-string]
git = "https://github.com/openai/codex"
rev = "bb5054fe47abe73ecbbd454751066a28c89f4bb9"

[dependencies.codex-otel]
git = "https://github.com/openai/codex"
rev = "bb5054fe47abe73ecbbd454751066a28c89f4bb9"

[dependencies.glob]
version = "0.3"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.tokio]
version = "1"
features = [
    "sync",
    "rt",
    "macros",
    "signal",
    "time",
]

[dependencies.tracing-appender]
version = "0.2.3"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Variant",
]

[dependencies.codex-protocol]
package = "codex-protocol"
git = "https://github.com/openai/codex"
rev = "bb5054fe47abe73ecbbd454751066a28c89f4bb9"

[dependencies.rand]
default-features = false
features = [
    "std",
    "small_rng",
]
version = "0.8"

[dependencies.dirs-next]
version = "2.0"

[target."cfg(windows)".dependencies.windows-sys]
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
]
version = "0.52"

[dev-dependencies.pretty_assertions]
version = "1.4.1"
