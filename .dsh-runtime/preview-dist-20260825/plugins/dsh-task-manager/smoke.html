<!doctype html>
<meta charset="utf-8">
<title>dsh-task-manager smoke</title>
<body>RUNNING</body>
<script>
  window.__ModuleLoader__ = { load(entry) { window.__entry = entry } }
</script>
<script src="./lib/client.js" onerror="document.body.textContent='FAIL: bundle load error'"></script>
<script>
  try {
    if (!window.__entry) throw new Error('bundle did not register with ModuleLoader')
    const React = {
      createElement(type, props, ...children) { return { type, props: { ...(props || {}), children } } },
      useEffect() {}, useId() { return 'smoke-id' }, useMemo(fn) { return fn() },
      useRef(value) { return { current: value } }, useState(value) { return [value, function () {}] },
    }
    const plugin = window.__entry.factory((name) => {
      if (name === 'react') return React
      throw new Error('unexpected require: ' + name)
    })
    let registration = null
    const ctx = {
      sessions: {},
      slots: {
        inject(name, mount) {
          if (name !== 'conversation.input.right') throw new Error('wrong slot: ' + name)
          return mount()
        },
        register(descriptor, component) {
          registration = { descriptor, component }
          return function () {}
        },
      },
    }
    plugin.apply(ctx)
    const ok = window.__entry.id === 'dsh-task-manager'
      && plugin.inject.join(',') === 'slots,sessions'
      && registration?.descriptor?.id === 'task-manager'
      && typeof registration?.component === 'function'
      && document.querySelector('style[data-plugin-css="dsh-task-manager/client.css"]')
    document.body.textContent = ok ? 'PASS' : 'FAIL'
  } catch (error) {
    document.body.textContent = 'FAIL: ' + (error && error.stack || error)
  }
</script>
